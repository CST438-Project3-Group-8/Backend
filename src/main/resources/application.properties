spring.application.name=spring-boot-docker

server.port=${PORT:8080}
# Database Connection using your Project ID and Password
# Direct database host is IPv6-oriented and is not resolving from this Docker environment.
# Use the Supabase session pooler for persistent app traffic over IPv4.
#spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres
spring.datasource.url=jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:6543/postgres?pgbouncer=true&prepareThreshold=0
spring.datasource.username=postgres.vosutyyfirytxbisusvh
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JWT Auth (Safe to keep as is, it's a public URL)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://vosutyyfirytxbisusvh.supabase.co/auth/v1

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#lower HIKARI connection pool size
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000
spring.datasource.hikari.connection-timeout=20000